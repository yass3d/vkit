<!-- Vkit original, drawn in the lucide grid: a dumbbell laid on the diagonal.
     One closed outline, so it keeps its shape at toolbox size where an inner
     stroke would fill in. -->
<svg
  class="lucide lucide-hair-rigidity"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path
    transform="rotate(-45 12 12)"
    d="M5 8h4v2.5h6V8h4v8h-4v-2.5H9V16H5z"
  />
</svg>

<!-- Vkit original, drawn in the lucide grid: two capsules meeting at a joint,
     which is what the hair actually collides with. -->
<svg
  class="lucide lucide-body-capsules"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect x="2" y="3" width="9" height="7" rx="3.5" />
  <rect x="10" y="12" width="12" height="7" rx="3.5" transform="rotate(-15 16 15.5)" />
</svg>

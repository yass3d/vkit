<!-- An awl: a solid head with an eye in it, tapering to a point. Drawn on
     lucide's 24-grid but filled rather than stroked, because what it says is
     "one strand, held", a single object picked out of a mass, and an outline of
     a needle at sixteen points across is a smudge.

     Wound so the eye is a hole: the outer path runs one way and the eye the
     other, which is what makes the fill skip it. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
>
  <path
    fill="currentColor"
    fill-rule="evenodd"
    d="M20.1 3.9a4.6 4.6 0 0 0-6.5 0l-1.9 1.9 6.5 6.5 1.9-1.9a4.6 4.6 0 0 0 0-6.5Z
       M10.6 7.3 3.1 19.2a1 1 0 0 0 1.7 1.7L16.7 13.4 10.6 7.3Z
       M17.9 5.3a2 2 0 1 1-2.8 2.8 2 2 0 0 1 2.8-2.8Z"
  />
</svg>

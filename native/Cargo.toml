[workspace]
members = [
    "vkit_geometry_core",
    "vkit_core",
    "vkit_semantic",
    "vkit_app",
]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yass3d/vkit"

[workspace.dependencies]
bytemuck = { version = "1.25.1", features = ["derive"] }
egui = { version = "0.35.0", default-features = false }
egui-wgpu = { version = "0.35.0", default-features = false }
egui-winit = { version = "0.35.0", default-features = false, features = [
    "clipboard",
] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
glam = { version = "0.33.2", features = ["bytemuck"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
pollster = "1.0.1"
rayon = "1.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
wgpu = { version = "29.0.0", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[patch.crates-io]
tract-tflite = { path = "vendor/tract-tflite" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# Unwinding, because nine `catch_unwind` sites are load-bearing.
#
# Under `abort` every one of them is dead code that reads as a safety net: the
# per-frame UI draw, five worker lanes, the export writer, the fit job, and the
# third-party Draco decode. A malformed asset out of somebody's collection
# would take the whole session down -- unsaved morph and hair work included --
# where unwinding costs one job or one frame and says so.
#
# The panic hook still writes its crash report either way; unwinding only adds
# survival. The one FFI callback (`nc_subclass_proc`, `extern "system"`) is not
# a hole: unwinding out of an `extern "system"` fn aborts at that boundary by
# language rule, so nothing unwinds into Win32.
panic = "unwind"

[profile.release-small]
inherits = "release"
opt-level = "z"

[profile.release-small.package.vkit-app]
opt-level = 3

[profile.release-small.package.vkit-core]
opt-level = 3

[profile.release-small.package.vkit-geometry-core]
opt-level = 3

[profile.release-small.package.vkit-semantic]
opt-level = 3

# The tract crates are optimized like everything else.
#
# They used to sit at the profile's own `opt-level = "z"`, bought with 28 ms
# per detection to save 5.39 MiB. That trade is off the table: function first,
# then speed, then size. Size is what a program that is right and quick
# happens to weigh, not something to spend either of the other two on.
# Measure with `cargo run --profile release-small -p vkit-semantic --example
# inference_cost`.
[profile.release-small.package.tract-core]
opt-level = 3

[profile.release-small.package.tract-linalg]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.vkit-app]
opt-level = 2
[profile.dev.package.vkit-core]
opt-level = 3

[profile.dev.package.vkit-geometry-core]
opt-level = 3

[profile.dev.package.vkit-semantic]
opt-level = 3

[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-tflite]
opt-level = 3

[profile.dev.package.wide]
opt-level = 3

[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
